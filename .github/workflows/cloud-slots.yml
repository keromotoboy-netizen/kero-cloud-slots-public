name: Kero Cloud Slots

on:
  push:
    branches: [main]
    paths:
      - "worker.py"
      - "runner_bridge.py"
      - ".github/workflows/cloud-slots.yml"
  workflow_dispatch:
    inputs:
      task:
        description: Tarefa pública permitida
        required: true
        type: choice
        options: [site-smoke, runtime-benchmark]
      slots:
        description: Quantidade de slots paralelos
        required: true
        default: "1"
        type: choice
        options: ["1","2","4","8","12","16"]
      runner:
        description: Tipo de runner padrão
        required: true
        default: linux
        type: choice
        options: [linux, windows, arm, windows-arm, macos, macos-intel, slim]
  repository_dispatch:
    types: [kero-cloud-task]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      task: ${{ steps.m.outputs.task }}
      runner: ${{ steps.m.outputs.runner }}
      variant: ${{ steps.m.outputs.variant }}
    steps:
      - id: m
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            SLOTS="1"
            TASK="site-smoke"
            RUNNER="linux"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOTS="${{ inputs.slots }}"
            TASK="${{ inputs.task }}"
            RUNNER="${{ inputs.runner }}"
          else
            SLOTS="${{ github.event.client_payload.slots }}"
            TASK="${{ github.event.client_payload.task }}"
            RUNNER="${{ github.event.client_payload.runner }}"
          fi

          case "$SLOTS" in 1|2|4|8|12|16) ;; *) SLOTS=1 ;; esac
          case "$TASK" in
            site-smoke|runtime-benchmark) ;;
            queue-worker)
              echo "::error::queue-worker is fail-closed after Cloudflare became canonical. Port GitHub OIDC to the Cloudflare control plane before re-enabling."
              exit 1
              ;;
            *) TASK=site-smoke ;;
          esac
          case "$RUNNER" in
            windows) LABEL=windows-latest; VARIANT=windows-x64 ;;
            arm) LABEL=ubuntu-24.04-arm; VARIANT=linux-arm64 ;;
            windows-arm) LABEL=windows-11-arm; VARIANT=windows-arm64 ;;
            macos) LABEL=macos-latest; VARIANT=macos-arm64 ;;
            macos-intel) LABEL=macos-15-intel; VARIANT=macos-intel ;;
            slim) LABEL=ubuntu-slim; VARIANT=linux-slim ;;
            *) LABEL=ubuntu-latest; VARIANT=linux-x64 ;;
          esac

          MATRIX=$(seq 1 "$SLOTS" | jq -Rsc 'split("\n")[:-1] | map(tonumber)')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          echo "runner=$LABEL" >> "$GITHUB_OUTPUT"
          echo "variant=$VARIANT" >> "$GITHUB_OUTPUT"

  slot:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJson(needs.prepare.outputs.matrix) }}
      max-parallel: 16
    runs-on: ${{ needs.prepare.outputs.runner }}
    timeout-minutes: 5
    env:
      KERO_RUNNER_VARIANT: ${{ needs.prepare.outputs.variant }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Site smoke
        if: needs.prepare.outputs.task == 'site-smoke'
        run: python runner_bridge.py site-smoke

      - name: Runtime benchmark
        if: needs.prepare.outputs.task == 'runtime-benchmark'
        env:
          KERO_SLOT: ${{ matrix.slot }}
        run: python runner_bridge.py benchmark
