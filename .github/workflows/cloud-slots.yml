name: Kero Cloud Slots

on:
  push:
    branches: [main]
    paths:
      - "worker.py"
      - ".github/workflows/cloud-slots.yml"
  workflow_dispatch:
    inputs:
      task:
        description: Tarefa pública permitida
        required: true
        type: choice
        options: [queue-worker, site-smoke, runtime-benchmark]
      slots:
        description: Quantidade de slots paralelos
        required: true
        default: "1"
        type: choice
        options: ["1","2","4","8","12","16"]
      runner:
        description: Tipo de runner padrão
        required: true
        default: linux
        type: choice
        options: [linux, windows, arm]
  repository_dispatch:
    types: [kero-cloud-task]

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      task: ${{ steps.m.outputs.task }}
      runner: ${{ steps.m.outputs.runner }}
    steps:
      - id: m
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            SLOTS="1"
            TASK="queue-worker"
            RUNNER="linux"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOTS="${{ inputs.slots }}"
            TASK="${{ inputs.task }}"
            RUNNER="${{ inputs.runner }}"
          else
            SLOTS="${{ github.event.client_payload.slots }}"
            TASK="${{ github.event.client_payload.task }}"
            RUNNER="${{ github.event.client_payload.runner }}"
          fi
          case "$SLOTS" in 1|2|4|8|12|16) ;; *) SLOTS=1 ;; esac
          case "$TASK" in queue-worker|site-smoke|runtime-benchmark) ;; *) TASK=queue-worker ;; esac
          case "$RUNNER" in
            windows) LABEL=windows-latest ;;
            arm) LABEL=ubuntu-24.04-arm ;;
            *) LABEL=ubuntu-latest ;;
          esac
          MATRIX=$(seq 1 "$SLOTS" | jq -Rsc 'split("\n")[:-1] | map(tonumber)')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          echo "runner=$LABEL" >> "$GITHUB_OUTPUT"

  slot:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJson(needs.prepare.outputs.matrix) }}
      max-parallel: 16
    runs-on: ${{ needs.prepare.outputs.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        if: needs.prepare.outputs.task == 'queue-worker'

      - name: Claim PUBLIC_SAFE job
        id: claim
        if: needs.prepare.outputs.task == 'queue-worker'
        shell: bash
        env:
          BRAIN_WORKER_URL: https://noqdjfuqaqlicugbqihv.supabase.co/functions/v1/kero-brain-github-worker
        run: |
          set -euo pipefail
          OIDC_JSON=$(curl -fsS             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kero-brain-worker")
          OIDC=$(printf '%s' "$OIDC_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.value)process.exit(2);process.stdout.write(j.value)})')
          curl -fsS             -H "Authorization: Bearer $OIDC"             -H "Content-Type: application/json"             -d '{"action":"claim","capabilities":["health","sha256","text-stats","json-summary","json-normalize","manifest"]}'             "$BRAIN_WORKER_URL" > claim.json
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('claim.json','utf8'));
          if(!r.ok) throw new Error(r.error||'claim_failed');
          const claimed=!!r.job;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'claimed='+String(claimed)+'\n');
          if(claimed) console.log(JSON.stringify({claimed:true,id:r.job.id,task:r.job.task,classification:r.job.classification}));
          else console.log(JSON.stringify({claimed:false,reason:r.reason||'empty_queue'}));
          NODE

      - name: Execute allowlisted worker
        id: work
        if: needs.prepare.outputs.task == 'queue-worker' && steps.claim.outputs.claimed == 'true'
        continue-on-error: true
        shell: bash
        run: python worker.py

      - name: Complete PUBLIC_SAFE job
        if: always() && needs.prepare.outputs.task == 'queue-worker' && steps.claim.outputs.claimed == 'true'
        shell: bash
        env:
          BRAIN_WORKER_URL: https://noqdjfuqaqlicugbqihv.supabase.co/functions/v1/kero-brain-github-worker
        run: |
          set -euo pipefail
          OIDC_JSON=$(curl -fsS             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kero-brain-worker")
          OIDC=$(printf '%s' "$OIDC_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.value)process.exit(2);process.stdout.write(j.value)})')
          node <<'NODE' > complete.json
          const fs=require('fs');
          const claim=JSON.parse(fs.readFileSync('claim.json','utf8'));
          let result={ok:false,error:'worker_result_missing'};
          try{result=JSON.parse(fs.readFileSync('result.json','utf8'))}catch{}
          const body=result.ok
            ? {action:'complete',id:claim.job.id,result:{task:result.task,result:result.result}}
            : {action:'complete',id:claim.job.id,error:String(result.error||'worker_failed').slice(0,500)};
          process.stdout.write(JSON.stringify(body));
          NODE
          curl -fsS             -H "Authorization: Bearer $OIDC"             -H "Content-Type: application/json"             --data-binary @complete.json             "$BRAIN_WORKER_URL" > complete-response.json
          node -e "const r=require('./complete-response.json'); if(!r.ok) throw new Error(r.error||'complete_failed'); console.log(JSON.stringify(r.job))"

      - name: Site smoke
        if: needs.prepare.outputs.task == 'site-smoke'
        shell: bash
        run: |
          node - <<'NODE'
          const urls=['https://keromotoboy.com.br','https://keromotoboy.com.br/rotas/','https://keromotoboy.com.br/calculadora/'];
          let bad=0;
          for (const u of urls) {
            let ok=false;
            for(let a=1;a<=3&&!ok;a++){
              try {
                const r=await fetch(u,{redirect:'follow',signal:AbortSignal.timeout(20000)});
                console.log(u,'->',r.status,'attempt',a);
                ok=r.status>=200&&r.status<400;
              } catch(e) { console.log(u,'->',e.message,'attempt',a); }
              if(!ok) await new Promise(r=>setTimeout(r,1000));
            }
            if(!ok) bad++;
          }
          process.exit(bad?2:0);
          NODE

      - name: Runtime benchmark
        if: needs.prepare.outputs.task == 'runtime-benchmark'
        shell: bash
        run: |
          node -e 'const t=Date.now();let x=0;for(let i=0;i<5e7;i++)x=(x+i)%1000000007;console.log({slot:${{ matrix.slot }},ms:Date.now()-t,x,platform:process.platform,arch:process.arch})'
