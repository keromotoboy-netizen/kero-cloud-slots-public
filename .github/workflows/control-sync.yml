name: Kero Control Jobs Validation

on:
  push:
    branches: [main]
    paths:
      - "control/jobs/*.json"
      - ".github/workflows/control-sync.yml"
  pull_request:
    branches: [main]
    paths:
      - "control/jobs/*.json"
      - ".github/workflows/control-sync.yml"

permissions:
  contents: read

concurrency:
  group: kero-control-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate public control job files only
        shell: python
        run: |
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import json
          import re
          import sys

          errors = []
          id_re = re.compile(r"^kero-[A-Za-z0-9._:-]{4,120}$")
          action_re = re.compile(r"^[A-Za-z0-9._:-]{2,100}$")
          allowed_targets = {"kids", "cinza", "any"}

          for path in sorted(Path("control/jobs").glob("kero-*.json")):
              try:
                  raw = path.read_text(encoding="utf-8")
                  if len(raw.encode("utf-8")) > 32768:
                      raise ValueError("arquivo maior que 32 KiB")
                  job = json.loads(raw)

                  file_id = path.stem
                  job_id = str(job.get("id", ""))
                  target = str(job.get("target", ""))
                  action = str(job.get("action", ""))
                  risk = job.get("risk")
                  params = job.get("params", {})
                  expires_raw = str(job.get("expires_at", ""))

                  if job_id != file_id or not id_re.fullmatch(job_id):
                      raise ValueError("id inválido ou diferente do nome do arquivo")
                  if target not in allowed_targets:
                      raise ValueError("target fora da allowlist")
                  if not action_re.fullmatch(action):
                      raise ValueError("action inválida")
                  if risk not in (1, 2):
                      raise ValueError("risk deve ser 1 ou 2")
                  if not isinstance(params, dict) or len(json.dumps(params)) > 16384:
                      raise ValueError("params inválido ou grande demais")

                  expires = datetime.fromisoformat(expires_raw.replace("Z", "+00:00"))
                  if expires.tzinfo is None:
                      raise ValueError("expires_at precisa de timezone")

              except Exception as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              for err in errors:
                  print(f"::error::{err}")
              sys.exit(1)

          print("Control job files are structurally valid.")
          print("No write is performed: Cloudflare/D1 is the canonical control plane.")
