name: Front 11 Temporal Durable Proof

on:
  push:
    branches: [main]
    paths:
      - "front11/**"
      - ".github/workflows/front11-temporal-proof.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  temporal-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Claim official Kero parent job
        id: claim
        shell: bash
        env:
          BRAIN_WORKER_URL: https://noqdjfuqaqlicugbqihv.supabase.co/functions/v1/kero-brain-github-worker
        run: |
          set -euo pipefail
          OIDC_JSON=$(curl -fsS             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kero-brain-worker")
          OIDC=$(printf '%s' "$OIDC_JSON" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          curl -fsS             -H "Authorization: Bearer $OIDC"             -H "Content-Type: application/json"             -d '{"action":"claim","capabilities":["front11-temporal-proof"]}'             "$BRAIN_WORKER_URL" > claim.json
          python - <<'PY'
          import json, os
          r=json.load(open("claim.json"))
          if not r.get("ok") or not r.get("job"):
              raise SystemExit("No official Front 11 parent job claimed: "+json.dumps(r))
          j=r["job"]
          payload=j.get("payload") or {}
          expected=payload.get("request_key_echo") or "front-11:temporal:durable-recovery:v1"
          mode=payload.get("proof") or "temporal-worker-crash-recovery"
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("job_id="+str(j["id"])+"\n")
              f.write("request_key="+str(expected)+"\n")
              f.write("proof_mode="+str(mode)+"\n")
          print(json.dumps({"claimed":True,"id":j["id"],"request_key":j.get("request_key"),"attempts":j.get("attempts")}))
          PY

      - name: Register Temporal external checkpoint in Central
        shell: bash
        env:
          BRAIN_WORKER_URL: https://noqdjfuqaqlicugbqihv.supabase.co/functions/v1/kero-brain-github-worker
          JOB_ID: ${{ steps.claim.outputs.job_id }}
          REQUEST_KEY: ${{ steps.claim.outputs.request_key }}
        run: |
          set -euo pipefail
          OIDC_JSON=$(curl -fsS             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kero-brain-worker")
          OIDC=$(printf '%s' "$OIDC_JSON" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          python - <<'PY' > checkpoint.json
          import json, os
          job=os.environ["JOB_ID"]
          key=os.environ["REQUEST_KEY"]
          print(json.dumps({
            "action":"checkpoint",
            "id":job,
            "checkpoint":{
              "front":11,
              "engine":"temporal",
              "phase":"STARTING_DURABLE_PROOF",
              "parent_job_id":job,
              "request_key":key,
              "external_workflow_id":"kero-front11-"+job,
              "authority":"brain.compute_jobs"
            }
          }))
          PY
          curl -fsS             -H "Authorization: Bearer $OIDC"             -H "Content-Type: application/json"             --data-binary @checkpoint.json             "$BRAIN_WORKER_URL" > checkpoint-response.json
          python -c 'import json; r=json.load(open("checkpoint-response.json")); assert r.get("ok"), r; print(r)'

      - name: Run Temporal crash and retry proof
        id: proof
        continue-on-error: true
        shell: bash
        env:
          JOB_ID: ${{ steps.claim.outputs.job_id }}
          REQUEST_KEY: ${{ steps.claim.outputs.request_key }}
          PROOF_MODE: ${{ steps.claim.outputs.proof_mode }}
          KERO_TEMPORAL_STATE: front11-state
        run: |
          set -uo pipefail
          START_EPOCH=$(date +%s)
          rm -rf front11-state
          mkdir -p front11-state

          if [ "$PROOF_MODE" = "temporal-tool-down" ]; then
            echo "EXPECTED_TEMPORAL_UNAVAILABLE: Temporal Service intentionally not started; Central must retain authority and place parent job into fallback." > client.err
            python - <<'PY'
            import socket
            s=socket.socket()
            s.settimeout(1.0)
            rc=s.connect_ex(("127.0.0.1",7233))
            s.close()
            print({"temporal_port_connect_ex":rc,"expected_nonzero":True})
            if rc == 0:
                raise SystemExit("unexpected Temporal service available")
            PY
            exit 42
          fi

          mem_kb() { awk '/MemAvailable:/{print $2}' /proc/meminfo; }
          net_bytes() { awk -F'[: ]+' 'NR>2 {rx+=$3; tx+=$11} END{print rx+tx}' /proc/net/dev; }
          MEM_BEFORE=$(mem_kb)
          NET_BEFORE=$(net_bytes)
          DISK_BEFORE=$(df -B1 --output=avail . | tail -1 | tr -d ' ')

          python -m pip install --disable-pip-version-check --quiet temporalio

          curl -fsSL https://temporal.download/cli.sh | sh
          TEMPORAL_BIN=$(command -v temporal || true)
          if [ -z "$TEMPORAL_BIN" ]; then
            TEMPORAL_BIN=$(find "$HOME" -type f -name temporal -perm -111 2>/dev/null | head -1)
          fi
          test -x "$TEMPORAL_BIN" || { echo "Temporal CLI not found"; exit 20; }
          "$TEMPORAL_BIN" --version

          "$TEMPORAL_BIN" server start-dev --ip 127.0.0.1 --port 7233 --ui-port 8233 > temporal-server.log 2>&1 &
          TPID=$!
          cleanup() {
            for p in "${TPID:-}" "${W1:-}" "${W2:-}" "${CPID:-}"; do
              if [[ "$p" =~ ^[1-9][0-9]*$ ]]; then kill "$p" 2>/dev/null || true; fi
            done
          }
          trap cleanup EXIT

          READY=0
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/7233) >/dev/null 2>&1; then READY=1; break; fi
            sleep 0.5
          done
          [ "$READY" = "1" ] || { cat temporal-server.log; exit 21; }

          python front11/temporal_proof.py worker > worker1.log 2>&1 &
          W1=$!
          sleep 2
          timeout 210s python front11/temporal_proof.py client             --parent-job-id "$JOB_ID"             --request-key "$REQUEST_KEY" > client-result.json 2> client.err &
          CPID=$!

          STEP1=0
          for i in $(seq 1 60); do
            if [ -f front11-state/step1.done ]; then STEP1=1; break; fi
            sleep 0.5
          done
          [ "$STEP1" = "1" ] || { cat worker1.log; cat client.err; exit 22; }

          WORKER1_RSS_KB=$(ps -o rss= -p "$W1" 2>/dev/null | tr -d ' ' || echo 0)
          WORKER1_CPU=$(ps -o %cpu= -p "$W1" 2>/dev/null | tr -d ' ' || echo 0)
          TEMPORAL_RSS_KB=$(ps -o rss= -p "$TPID" 2>/dev/null | tr -d ' ' || echo 0)
          TEMPORAL_CPU=$(ps -o %cpu= -p "$TPID" 2>/dev/null | tr -d ' ' || echo 0)

          # Simulate abrupt Worker loss. Temporal Service stays alive and keeps Event History.
          kill -9 "$W1" 2>/dev/null || true
          wait "$W1" 2>/dev/null || true
          W1=0
          printf 'true' > front11-state/worker1-killed
          sleep 4

          python front11/temporal_proof.py worker > worker2.log 2>&1 &
          W2=$!

          wait "$CPID"
          CLIENT_RC=$?
          CPID=0
          kill "$W2" 2>/dev/null || true
          wait "$W2" 2>/dev/null || true
          W2=0

          MEM_AFTER=$(mem_kb)
          NET_AFTER=$(net_bytes)
          DISK_AFTER=$(df -B1 --output=avail . | tail -1 | tr -d ' ')
          END_EPOCH=$(date +%s)
          ELAPSED=$((END_EPOCH-START_EPOCH))
          CLI_BYTES=$(du -sb "$HOME/.temporalio" 2>/dev/null | awk '{print $1}' || echo 0)
          SDK_BYTES=$(python - <<'PY'
          import os, temporalio
          from pathlib import Path
          root=Path(temporalio.__file__).parent
          total=sum(p.stat().st_size for p in root.rglob("*") if p.is_file())
          print(total)
          PY
          )

          if [ "$CLIENT_RC" -ne 0 ]; then
            echo "Client failed rc=$CLIENT_RC"
            cat client.err
            cat worker1.log
            cat worker2.log
            exit "$CLIENT_RC"
          fi

          export MEM_BEFORE MEM_AFTER NET_BEFORE NET_AFTER DISK_BEFORE DISK_AFTER
          export WORKER1_RSS_KB WORKER1_CPU TEMPORAL_RSS_KB TEMPORAL_CPU ELAPSED CLI_BYTES SDK_BYTES
          python - <<'PY'
          import json, os
          raw=open("client-result.json").read().strip().splitlines()
          if not raw:
              raise SystemExit("client result missing")
          base=json.loads(raw[-1])
          base["worker_crash_observed"]=os.path.exists("front11-state/worker1-killed")
          base["metrics"]={
            "elapsed_s":int(os.environ["ELAPSED"]),
            "mem_available_before_kb":int(os.environ["MEM_BEFORE"]),
            "mem_available_after_kb":int(os.environ["MEM_AFTER"]),
            "network_bytes_delta":max(0,int(float(os.environ["NET_AFTER"]))-int(float(os.environ["NET_BEFORE"]))),
            "disk_available_delta_bytes":int(os.environ["DISK_AFTER"])-int(os.environ["DISK_BEFORE"]),
            "temporal_server_rss_kb":int(os.environ["TEMPORAL_RSS_KB"] or 0),
            "temporal_server_cpu_pct_sample":os.environ["TEMPORAL_CPU"] or "0",
            "worker_rss_kb_sample":int(os.environ["WORKER1_RSS_KB"] or 0),
            "worker_cpu_pct_sample":os.environ["WORKER1_CPU"] or "0",
            "temporal_cli_bytes":int(os.environ["CLI_BYTES"] or 0),
            "temporal_python_sdk_bytes":int(os.environ["SDK_BYTES"] or 0),
          }
          base["proof_passed"]=bool(base.get("proof_passed") and base["worker_crash_observed"])
          open("proof-result.json","w").write(json.dumps(base,sort_keys=True))
          print(json.dumps(base,indent=2,sort_keys=True))
          if not base["proof_passed"]:
              raise SystemExit("proof assertions failed")
          PY

      - name: Complete official parent job
        if: always()
        shell: bash
        env:
          BRAIN_WORKER_URL: https://noqdjfuqaqlicugbqihv.supabase.co/functions/v1/kero-brain-github-worker
          JOB_ID: ${{ steps.claim.outputs.job_id }}
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
        run: |
          set -euo pipefail
          test -n "$JOB_ID"
          OIDC_JSON=$(curl -fsS             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kero-brain-worker")
          OIDC=$(printf '%s' "$OIDC_JSON" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          export PROOF_OUTCOME
          python - <<'PY' > complete.json
          import json, os
          job=os.environ["JOB_ID"]
          outcome=os.environ.get("PROOF_OUTCOME","failure")
          try:
              result=json.load(open("proof-result.json"))
          except Exception:
              result=None
          if outcome=="success" and result and result.get("proof_passed"):
              body={"action":"complete","id":job,"result":{"front":11,"engine":"temporal","proof":result}}
          else:
              detail=""
              for p in ("client.err","temporal-server.log","worker1.log","worker2.log"):
                  try:
                      detail += "\n["+p+"]\n"+open(p).read()[-1500:]
                  except Exception:
                      pass
              body={"action":"complete","id":job,"error":("TEMPORAL_PROOF_FAILED "+detail)[-900:]}
          print(json.dumps(body))
          PY
          curl -fsS             -H "Authorization: Bearer $OIDC"             -H "Content-Type: application/json"             --data-binary @complete.json             "$BRAIN_WORKER_URL" > complete-response.json
          python -c 'import json; r=json.load(open("complete-response.json")); assert r.get("ok"), r; print(json.dumps(r))'
