name: Publish Kero Cloud Slot Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloud-slot/**"
      - ".github/workflows/publish-cloud-slot.yml"

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./cloud-slot
          push: true
          tags: |
            ghcr.io/keromotoboy-netizen/kero-cloud-slot:latest
            ghcr.io/keromotoboy-netizen/kero-cloud-slot:${{ github.sha }}
          platforms: linux/amd64

      - name: Attest container provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/keromotoboy-netizen/kero-cloud-slot
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
