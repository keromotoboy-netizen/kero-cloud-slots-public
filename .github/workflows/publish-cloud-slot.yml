name: Publish Kero Cloud Slot Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloud-slot/**"
      - ".github/workflows/publish-cloud-slot.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./cloud-slot
          push: true
          tags: |
            ghcr.io/keromotoboy-netizen/kero-cloud-slot:latest
            ghcr.io/keromotoboy-netizen/kero-cloud-slot:${{ github.sha }}
          platforms: linux/amd64
