name: One-time Canonical Queue Runner Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runner-queue-probe.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-slim
            os: ubuntu-slim
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: windows-x64
            os: windows-latest
          - name: windows-arm64
            os: windows-11-arm
          - name: macos-arm64
            os: macos-latest
          - name: macos-intel
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      KERO_RUNNER_VARIANT: ${{ matrix.name }}
      BRAIN_WORKER_URL: https://noqdjfuqaqlicugbqihv.supabase.co/functions/v1/kero-brain-github-worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Claim canonical PUBLIC_SAFE job
        id: claim
        run: python runner_bridge.py claim
      - name: Execute allowlisted worker
        if: steps.claim.outputs.claimed == 'true'
        run: python worker.py
      - name: Complete canonical PUBLIC_SAFE job
        if: always() && steps.claim.outputs.claimed == 'true'
        run: python runner_bridge.py complete
      - name: Require one claimed job
        if: steps.claim.outputs.claimed != 'true'
        run: python -c "raise SystemExit('expected canonical probe job but queue was empty')"
